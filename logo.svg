<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Premium Crimson Gradient -->
    <linearGradient id="crimsonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D6D" />
      <stop offset="50%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Shutter Hexagon (Soft White) -->
  <path d="M60 10 L103.3 35 L103.3 85 L60 110 L16.7 85 L16.7 35 Z" fill="none" stroke="#F5F0F2" stroke-width="6" stroke-linejoin="round" />

  <!-- Abstract Aperture Blades -->
  <g stroke="#F5F0F2" stroke-width="4" stroke-linecap="round">
    <line x1="60" y1="10" x2="60" y2="45" />
    <line x1="103.3" y1="85" x2="75" y2="70" />
    <line x1="16.7" y1="85" x2="45" y2="70" />
  </g>

  <!-- Inner Glowing Crimson Lens Core -->
  <circle cx="60" cy="60" r="16" fill="url(#crimsonGradient)" filter="url(#glow)" />
  <circle cx="60" cy="60" r="6" fill="#F5F0F2" />
</svg>
